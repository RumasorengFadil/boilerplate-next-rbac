name: Build and deploy

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read
  packages: write

concurrency:
  group: lunabiner-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_APP_URL: https://ci.invalid
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      AI_ASSISTANT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  publish:
    name: Publish immutable images
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      app_image: ${{ steps.image.outputs.app }}@${{ steps.app.outputs.digest }}
      migrator_image: ${{ steps.image.outputs.migrator }}@${{ steps.migrator.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Derive registry image names
        shell: bash
        run: |
          echo "app=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lunabiner-app" >> "$GITHUB_OUTPUT"
          echo "migrator=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lunabiner-migrator" >> "$GITHUB_OUTPUT"
      - id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ github.ref_name == 'main' && 'https://lunabiner.com' || 'https://staging.lunabiner.com' }}
          tags: ${{ steps.image.outputs.app }}:${{ github.sha }}
      - id: migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ steps.image.outputs.migrator }}:${{ github.sha }}

  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://lunabiner.com' || 'https://staging.lunabiner.com' }}
    env:
      APP_IMAGE: ${{ needs.publish.outputs.app_image }}
      MIGRATION_IMAGE: ${{ needs.publish.outputs.migrator_image }}
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      DEPLOY_DIRECTORY: ${{ vars.DEPLOY_DIRECTORY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for value in DEPLOY_DIRECTORY DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!value}" ]; then
              echo "Missing environment deployment configuration: $value" >&2
              exit 1
            fi
          done
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
      - name: Run guarded remote deployment
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_IMAGE='$APP_IMAGE' MIGRATION_IMAGE='$MIGRATION_IMAGE' DEPLOY_ENV='$DEPLOY_ENV' bash -s -- '$DEPLOY_DIRECTORY'" <<'REMOTE'
          set -euo pipefail
          deploy_directory="$1"
          cd "$deploy_directory"

          compose_files=(-f compose.yml)
          if [ "$DEPLOY_ENV" = "production" ]; then
            compose_files+=(-f compose.production.yml)
          fi

          docker compose --env-file .env "${compose_files[@]}" pull app migrate
          docker compose --env-file .env "${compose_files[@]}" --profile operations run --rm migrate
          docker compose --env-file .env "${compose_files[@]}" up -d --remove-orphans
          docker compose --env-file .env "${compose_files[@]}" ps
          REMOTE
